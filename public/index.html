<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --panel:#FFFFFF; --ink:#1F1E1D; --muted:#73726C; --line:#E6E3D9;
  --user:#EFECE2; --accent:#D9822B; --accent-ink:#FFFFFF; --code:#F1EFE6;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#262624; --panel:#30302E; --ink:#EDEBE4; --muted:#A3A19A; --line:#43423E;
    --user:#3A3936; --accent:#F0A04B; --accent-ink:#1F1E1D; --code:#1F1E1D;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.5rem;font-weight:500;letter-spacing:-.01em}
.spark{width:22px;height:22px;fill:var(--accent);flex:none}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.ghost:hover{background:var(--user)}

main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{width:100%;max-width:740px;margin:0 auto;padding:0 20px}

#hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14vh}
#hero .spark{width:38px;height:38px;margin-bottom:14px}
#hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);margin:0 0 26px;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.chip:hover{background:var(--user);color:var(--ink)}

#thread{display:flex;flex-direction:column;gap:26px;padding-top:16px;padding-bottom:30px}
.row{display:flex;gap:12px;line-height:1.65;font-size:1rem}
.row.user{justify-content:flex-end}
.row.user .content{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.row.bot .spark{width:20px;height:20px;margin-top:5px}
.row.bot .content{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.content pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:10px 0;white-space:pre;font-size:.85rem;line-height:1.5}
.content code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.content :not(pre)>code{background:var(--code);padding:2px 6px;border-radius:6px;font-size:.88em}
.dots{display:inline-flex;gap:5px;padding-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.35}30%{opacity:1}}

.composer{padding:0 20px 18px}
.box{max-width:740px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:12px 12px 12px 18px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;background:transparent;resize:none;outline:0;font-size:1rem;line-height:1.5;max-height:200px;padding:6px 0}
textarea::placeholder{color:var(--muted)}
.send{width:38px;height:38px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{max-width:740px;margin:8px auto 0;text-align:center;font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}.dots i{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 14h6l-1.5 8L20 9.5h-6.5z"/></svg>Flash</div>
  <button class="ghost" id="new" type="button">New chat</button>
</header>

<main id="scroll">
  <div class="col">
    <section id="hero">
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 14h6l-1.5 8L20 9.5h-6.5z"/></svg>
      <h2>How can I help you today?</h2>
      <div class="chips" id="chips"></div>
    </section>
    <section id="thread" aria-live="polite"></section>
  </div>
</main>

<div class="composer">
  <form class="box" id="form">
    <textarea id="input" rows="1" placeholder="Message Flash" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send message" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="note">Chats aren’t saved. Refresh the page to start over.</p>
</div>

<script>
var SPARK='<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 14h6l-1.5 8L20 9.5h-6.5z"/></svg>';
var scrollEl=document.getElementById('scroll'),thread=document.getElementById('thread'),
    hero=document.getElementById('hero'),form=document.getElementById('form'),
    input=document.getElementById('input'),sendBtn=document.getElementById('send');
var chatHistory=[],busy=false;
var ideas=['Explain AI in simple words','Help me plan my study week','Write a polite email','Tell me a fun fact'];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// Tiny, safe formatter: escapes everything first, then adds code blocks, inline code and bold.
function fmt(s){
  return s.split('```').map(function(p,i){
    if(i%2){return '<pre><code>'+esc(p.replace(/^[^\n]*\n/,''))+'</code></pre>';}
    return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  }).join('');
}
function addRow(who,html,isText){
  var r=document.createElement('div');r.className='row '+who;
  var c=document.createElement('div');c.className='content';
  if(isText)c.textContent=html;else c.innerHTML=html;
  if(who==='bot')r.innerHTML=SPARK;
  r.appendChild(c);thread.appendChild(r);
  scrollEl.scrollTop=scrollEl.scrollHeight;return c;
}
async function send(text){
  text=text.trim();if(!text||busy)return;
  busy=true;hero.style.display='none';
  addRow('user',text,true);chatHistory.push({role:'user',content:text});
  input.value='';grow();
  var c=addRow('bot','<span class="dots"><i></i><i></i><i></i></span>');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Something went wrong.');
    chatHistory.push({role:'assistant',content:d.reply});
    c.innerHTML=fmt(d.reply);
  }catch(e){
    chatHistory.pop();c.textContent='Error: '+e.message;
  }
  busy=false;scrollEl.scrollTop=scrollEl.scrollHeight;input.focus();
}
function grow(){
  input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';
  sendBtn.disabled=!input.value.trim();
}
input.addEventListener('input',grow);
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value);}
});
form.addEventListener('submit',function(e){e.preventDefault();send(input.value);});
document.getElementById('new').onclick=function(){
  chatHistory=[];thread.innerHTML='';hero.style.display='flex';input.value='';grow();input.focus();
};
ideas.forEach(function(t){
  var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;
  b.onclick=function(){send(t);};document.getElementById('chips').appendChild(b);
});
input.focus();
</script>
</body>
</html>
